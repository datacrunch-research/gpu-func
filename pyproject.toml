[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-func-cli"
version = "0.2.0"
description = "CUDA exercise and kernel workflows on the gfaas GPU service"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Aditya Jitta" }]
# TODO: choose a license (add e.g. license = "MIT" plus a LICENSE file) before publishing.
dependencies = ["gfaas>=0.1.0"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Environment :: Console",
]

[project.urls]
Repository = "https://github.com/datacrunch-research/gpu-func"

[project.optional-dependencies]
dev = ["mypy>=1.10", "pytest>=8", "ruff>=0.16,<0.17"]

[project.scripts]
gpu-func = "gpu_func_cli.cli:main"
gpu_func_cli = "gpu_func_cli.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
gfaas = { path = "../gfaas", editable = true }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["gfaas", "gfaas.*", "ncu_report"]
ignore_missing_imports = true
