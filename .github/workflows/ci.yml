name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install package and development dependencies
        run: python -m pip install --disable-pip-version-check --editable ".[dev]"

      - name: Check dependencies
        run: python -m pip check

      - name: Run Ruff
        run: python -m ruff check src tests

      - name: Check Python formatting
        run: python -m ruff format --check src tests

      - name: Run mypy
        run: python -m mypy src

  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: python -m pip install --disable-pip-version-check --editable ".[dev,training-example]"

      - name: Run tests
        run: python -m pytest -q

  package:
    name: Build and install package
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Build source and wheel distributions
        run: |
          python -m pip install --disable-pip-version-check build
          python -m build

      - name: Check wheel license
        run: >-
          python -c 'import glob, zipfile; wheel, = glob.glob("dist/*.whl");
          assert any(name.endswith(".dist-info/licenses/LICENSE")
          for name in zipfile.ZipFile(wheel).namelist())'

      - name: Install and smoke-test the wheel
        run: |
          python -m venv "${RUNNER_TEMP}/package-check"
          "${RUNNER_TEMP}/package-check/bin/pip" install --disable-pip-version-check dist/*.whl
          "${RUNNER_TEMP}/package-check/bin/python" -c "import gfaas"
          "${RUNNER_TEMP}/package-check/bin/gfaas" --help
